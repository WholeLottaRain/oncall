# Attach this release to an existing Grafana 13.2.4 or newer.
# On that Grafana, before install:
#   [feature_toggles]
#   enable = externalServiceAccounts
#   accessControlOnCall = false
#   [auth]
#   managed_service_accounts_enabled = true
# The grafana-oncall-app plugin must already be installed there.
# 13.2.4 includes the 2026-10-13 fixes. 13.2.0 through 13.2.3 do not.
grafana:
  enabled: false
externalGrafana:
  url: https://grafana.example.com
  version: "13.2.4"
  provision: true
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
